version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: bvmodas-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file:
      - .env
    volumes:
      # Código fonte montado (hot reload)
      - ./src:/app/src
      - ./prisma:/app/prisma
      # node_modules NÃO é montado (fica da imagem)
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bvmodas-net
    command: sh -c "npx prisma migrate deploy && npm run start:dev"

  postgres:
    image: postgres:16-alpine
    container_name: bvmodas-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bvmodas
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bvmodas-net

  redis:
    image: redis:7-alpine
    container_name: bvmodas-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - bvmodas-net

volumes:
  postgres-data:
  redis-data:

networks:
  bvmodas-net:
    driver: bridge